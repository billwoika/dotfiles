# ~/.config/tmux/tmux.conf
# ─────────────────────────────────────────────────────────────────────
# tmux configuration — XDG-located, emacs-mode, minimal plugin footprint.
# ─────────────────────────────────────────────────────────────────────

# ── Prefix key ──────────────────────────────────────────────────────
# KEEP the default C-b. The common advice to rebind to C-a is a trap
# for emacs users: C-a is beginning-of-line, which you use constantly
# in every shell prompt. Rebinding it steals that keystroke from zsh.
# C-b is already clear of any useful default binding.
# set -g prefix C-b          # (default — shown for documentation)

# ── Terminal capabilities ───────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,*256col*:RGB"

# Pass through OSC 52 clipboard escapes (iTerm2, WezTerm, Alacritty, Kitty).
# tmux 3.4+ requires every parameter up to the highest %pN used to be
# referenced; the older ";c;%p2%s" form (which skips %p1) is rejected.
# %p1%.0s references param 1 but emits nothing, satisfying the parser
# while keeping the selection target hardcoded to 'c'.
set -s set-clipboard on
set -ag terminal-overrides ",*:Ms=\\E]52;c%p1%.0s;%p2%s\\7"

# Focus events for editors that care (vim, neovim, emacs autoread).
set -g focus-events on

# Faster escape key (default 500ms causes perceptible lag in vim).
set -sg escape-time 10

# ── Window and pane indexing ────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── History ─────────────────────────────────────────────────────────
set -g history-limit 100000

# ── Mouse ───────────────────────────────────────────────────────────
set -g mouse on

# ── emacs mode for copy and status input ────────────────────────────
setw -g mode-keys emacs
set -g status-keys emacs

# ── Activity monitoring (silent; no bell storm) ─────────────────────
setw -g monitor-activity on
set -g visual-activity off

# ── Status bar ──────────────────────────────────────────────────────
set -g status-interval 5
set -g status-position top
set -g status-style "bg=default,fg=#7A7974"
set -g status-left-length 50
set -g status-right-length 100
set -g status-left  "#[fg=#0C4E54,bold]■ #S #[fg=#7A7974]"
set -g status-right "#[fg=#7A7974]#(whoami)@#H #[fg=#0C4E54]%H:%M "
setw -g window-status-current-style "fg=#0C4E54,bold"
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "

# Pane borders
set -g pane-border-style        "fg=#D1CFC9"
set -g pane-active-border-style "fg=#0C4E54"

# ── Keybindings ─────────────────────────────────────────────────────

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded."

# Splits open in the current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window        -c "#{pane_current_path}"

# Pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quickly swap to the last window
bind Tab last-window

# Kill current pane without confirmation prompt
bind x kill-pane

# ── Nested tmux escape (F12) ────────────────────────────────────────
# F12 toggles the local prefix off, letting the inner (remote) tmux
# receive C-b directly. Press F12 again to reclaim the local prefix.
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    if -F "#{pane_in_mode}" "send-keys -X cancel" \;\
    refresh-client -S
bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    refresh-client -S

# ── Optional: tmux plugin manager (tpm) ─────────────────────────────
# Uncomment the block below after installing tpm:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Reload config, then press prefix + I to install plugins.
#
# set -g @plugin "tmux-plugins/tpm"
# set -g @plugin "tmux-plugins/tmux-resurrect"
# set -g @plugin "tmux-plugins/tmux-continuum"
# set -g @continuum-restore "on"
# set -g @continuum-save-interval "15"
# run "~/.config/tmux/plugins/tpm/tpm"
